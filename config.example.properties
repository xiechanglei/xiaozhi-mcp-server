# 小智 MCP 接入点配置模板
# 复制本文件为 config.properties 并填入真实信息（config.properties 不会被提交）

# ===== 必填：小智接入点 =====
xiaozhi.endpoint=wss://api.xiaozhi.me/mcp/
xiaozhi.token=在这里填入你的小智 MCP 接入点 token

# ===== 可选：MCP 服务标识 =====
server.name=xiaozhi-mcp-server
server.version=1.0.0

# ===== 可选：断线重连间隔（毫秒），默认 5000 =====
reconnect.interval.ms=5000
